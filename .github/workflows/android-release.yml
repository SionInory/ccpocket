name: Android Release

on:
  push:
    tags:
      - 'android/v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        run: |
          version=$(sed -n 's/^flutter = "\([^"]*\)"/\1/p' .mise.toml)
          test -n "$version"
          echo "flutter_version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;29.0.13846066"
      - name: Generate signing key
        env:
          SIGNING_PASSWORD: ccpocket-ci
        run: |
          # The key changes on every run, so these APKs cannot update each other in place.
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ccpocket-ci.jks" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias ccpocket \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=ccpocket CI, O=ccpocket, C=CN" \
            -noprompt
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/ccpocket-ci.jks"
            printf 'storePassword=%s\n' "$SIGNING_PASSWORD"
            printf 'keyAlias=ccpocket\n'
            printf 'keyPassword=%s\n' "$SIGNING_PASSWORD"
          } > apps/mobile/android/keystore.properties
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build signed APK
        working-directory: apps/mobile
        run: flutter build apk --release
      - name: Verify APK signature
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android/v}"
          asset="ccpocket-android-${version}.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$asset"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --verify-tag \
              --title "Android $version" \
              --generate-notes
          fi
