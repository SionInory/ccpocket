name: Android Release

on:
  push:
    tags:
      - 'android/v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/mobile/android/netbird/go.sum
      - name: Read Flutter version from .mise.toml
        id: mise
        run: |
          version=$(sed -n 's/^flutter = "\([^"]*\)"/\1/p' .mise.toml)
          test -n "$version"
          echo "flutter_version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate localizations
        working-directory: apps/mobile
        run: flutter gen-l10n
      - name: Test Netbird proxy
        working-directory: apps/mobile/android/netbird
        run: go test ./...
      - name: Test Flutter app
        working-directory: apps/mobile
        run: flutter test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/mobile/android/netbird/go.sum
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^version: //p' apps/mobile/pubspec.yaml)
            test -n "$version"
            tag="android/v$version"
          fi
          remote_sha=$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          fi
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag points to $remote_sha, not $GITHUB_SHA. Bump the version or run from that tag."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#android/v}"
            echo "tag_exists=$([ -n "$remote_sha" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: Read Flutter version from .mise.toml
        id: mise
        run: |
          version=$(sed -n 's/^flutter = "\([^"]*\)"/\1/p' .mise.toml)
          test -n "$version"
          echo "flutter_version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;29.0.13846066"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260816165457-f98cc9b3c733
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260816165457-f98cc9b3c733
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          test -x "$(go env GOPATH)/bin/gobind"
      - name: Generate signing key
        env:
          SIGNING_PASSWORD: ccpocket-ci
        run: |
          # The key changes on every run, so these APKs cannot update each other in place.
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ccpocket-ci.jks" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias ccpocket \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=ccpocket CI, O=ccpocket, C=CN" \
            -noprompt
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/ccpocket-ci.jks"
            printf 'storePassword=%s\n' "$SIGNING_PASSWORD"
            printf 'keyAlias=ccpocket\n'
            printf 'keyPassword=%s\n' "$SIGNING_PASSWORD"
          } > apps/mobile/android/keystore.properties
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate localizations
        working-directory: apps/mobile
        run: flutter gen-l10n
      - name: Build Netbird AAR
        working-directory: apps/mobile/android/netbird
        run: |
          mkdir -p ../app/libs
          CGO_ENABLED=0 gomobile bind \
            -target=android/arm64 \
            -androidapi 24 \
            -javapkg=com.nb.ccpocket \
            -ldflags="-linkmode=external -extldflags=-Wl,-z,max-page-size=16384 -checklinkname=0" \
            -o ../app/libs/netbird.aar \
            .
      - name: Build signed APK
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify application ID
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          aapt=$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt"
          package_id=$("$aapt" dump badging "$apk" | awk -F"'" '/^package: name=/{ print $2; exit }')
          printf 'Application ID: %s\n' "$package_id"
          test "$package_id" = "com.nb.ccpocket"
      - name: Verify APK contains only arm64
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          abis=$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 1 { print $2 }' | sort -u)
          printf 'APK ABIs:\n%s\n' "$abis"
          test "$abis" = "arm64-v8a"
      - name: Verify 16 KB page alignment
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          zipalign=$(find "${ANDROID_HOME:?}/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -x "$zipalign"
          "$zipalign" -c -P 16 -v 4 "$apk" > /dev/null

          readelf="${ANDROID_NDK_HOME:?}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          tmp=$(mktemp -d)
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$tmp"
          for so in "$tmp"/lib/arm64-v8a/*.so; do
            for alignment in $("$readelf" -l "$so" | awk '$1 == "LOAD" { print $NF }'); do
              test $((alignment)) -ge 16384 || {
                echo "::error::$so has a LOAD segment aligned below 16 KB"
                exit 1
              }
            done
          done
      - name: Verify APK signature
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          asset="ccpocket-android-arm64-${VERSION}.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          elif [ "$TAG_EXISTS" = "true" ]; then
            gh release create "$TAG" "$asset" \
              --verify-tag \
              --title "Android ARM64 $VERSION" \
              --generate-notes
          else
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Android ARM64 $VERSION" \
              --generate-notes
          fi
